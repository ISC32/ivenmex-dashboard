<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVENMEX - Dashboard</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logos/logo-invemex.png?v=6">
    <link rel="shortcut icon" type="image/png" href="assets/logos/logo-invemex.png?v=6">
    <link rel="apple-touch-icon" href="assets/logos/logo-invemex.png?v=6">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Genos:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos del dashboard -->
    <link rel="stylesheet" href="css/dashboardInvemex.css?v=6">
</head>
<body>

    <!-- SKIP LINK (accesibilidad) -->
    <a class="sr-only skip-link" href="#dashboard">Saltar al contenido</a>

    <!-- TOAST CONTAINER -->
    <div class="md-toast-container" id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- LOADER PRINCIPAL -->
    <div id="ivx-loader" aria-hidden="false">
        <div class="loader-card">
            <img src="assets/logos/logo-invemex.png" alt="IVENMEX" class="loader-logo" onerror="this.style.display='none'">
            <div class="loader-spinner" aria-hidden="true"></div>
            <h1 class="loader-title">IVENMEX</h1>
            <p class="loader-subtitle">Conectando servicios, espere...</p>
            <div id="error-container"></div>
        </div>
    </div>

    <!-- LOADING LEGACY (Mantenido para compatibilidad con el hook del JS) -->
    <div id="loading-overlay" class="hidden" aria-hidden="true">
        <div class="md-loading-spinner" aria-hidden="true"></div>
        <div class="md-loading-text" id="loading-text">IVENMEX</div>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <main id="dashboard" role="main" aria-hidden="true">

        <!-- TOOLBAR -->
        <header class="md-toolbar" role="banner">
            <a href="#" class="md-toolbar-brand" aria-label="Página principal INVEMEX">
                <img src="assets/logos/logo-invemex.png" alt="INVEMEX" onerror="this.style.display='none'">
                <span class="brand-text">IVENMEX</span>
            </a>
            <div class="md-toolbar-actions">
                <div class="md-calendar-wrapper">
                    <span class="md-chip" id="fecha-actual" role="button" tabindex="0" aria-expanded="false" style="cursor: pointer;" onclick="App.toggleCalendar()">
                        <i class="far fa-calendar-alt" aria-hidden="true"></i>
                        <span id="fecha-texto"></span>
                        <i class="fas fa-chevron-down" style="font-size: 10px; margin-left: 4px; opacity: 0.6;" aria-hidden="true"></i>
                    </span>
                    <div class="md-calendar-dropdown" id="calendar-dropdown">
                        <div class="md-calendar-header">
                            <button class="nav-btn" onclick="event.stopPropagation(); App.calendarNavigate(-1);" aria-label="Mes anterior"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
                            <span class="month-year" id="calendar-month-year">Enero 2024</span>
                            <button class="nav-btn" onclick="event.stopPropagation(); App.calendarNavigate(1);" aria-label="Mes siguiente"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
                        </div>
                        <div class="md-calendar-grid" id="calendar-grid">
                            <div class="weekday">L</div><div class="weekday">M</div><div class="weekday">X</div>
                            <div class="weekday">J</div><div class="weekday">V</div><div class="weekday">S</div><div class="weekday">D</div>
                        </div>
                        <div class="md-calendar-footer">
                            <span id="calendar-info">Semana 1</span>
                            <button class="today-btn" onclick="event.stopPropagation(); App.calendarGoToday();">Hoy</button>
                        </div>
                    </div>
                </div>
                <span class="md-chip" style="cursor: pointer; position: relative;" onclick="App.mostrarNotificaciones()" role="button" aria-label="Mostrar notificaciones">
                    <i class="fas fa-bell" aria-hidden="true"></i>
                    <span class="chip-dot" id="notificaciones-badge" style="position: absolute; top: -4px; right: -4px; background: #EF4444; color: white; width: 18px; height: 18px; display: flex; align-items:center; justify-content:center; font-weight:700; border-radius:9999px;">0</span>
                </span>
                <div class="md-avatar" onclick="App.mostrarNotificaciones()" role="button" aria-label="Perfil usuario">L</div>
            </div>
        </header>

        <!-- OVERLAY CALENDARIO -->
        <div class="md-calendar-overlay" id="calendar-overlay" onclick="App.closeCalendar()" aria-hidden="true"></div>

        <!-- EMPLEADOS -->
        <div class="empleados-section">
            <div class="section-header">
                <div class="section-title">
                    <i class="fas fa-users" style="color: var(--md-primary);" aria-hidden="true"></i> Equipo de Trabajo
                    <span class="total-badge" id="empleados-total-badge">0</span>
                </div>
                <button class="md-btn md-btn-text md-btn-sm" onclick="App.cargarEmpleadosYTareas();" title="Actualizar empleados" aria-label="Actualizar empleados">
                    <i class="fas fa-sync-alt" aria-hidden="true"></i>
                </button>
            </div>
            <div class="empleados-avatar-grid" id="empleadosAvatarGrid">
                <div style="text-align:center; padding:20px; width:100%; color: var(--md-text-secondary); font-size:14px;">
                    <i class="fas fa-spinner fa-spin" style="display:inline-block; margin-right:8px;" aria-hidden="true"></i> Cargando empleados...
                </div>
            </div>
        </div>

        <!-- KPI CARDS -->
        <div class="md-grid">
            <div class="md-card primary">
                <div class="card-icon"><i class="fas fa-clipboard-list" aria-hidden="true"></i></div>
                <div class="card-label">Pedidos Activos</div>
                <div class="card-value" id="kpi-activos">0</div>
                <div class="card-change up"><i class="fas fa-arrow-up" aria-hidden="true"></i> <span id="kpi-activos-change">Cargando...</span></div>
            </div>
            <div class="md-card warning">
                <div class="card-icon"><i class="fas fa-clock" aria-hidden="true"></i></div>
                <div class="card-label">En Producción</div>
                <div class="card-value" id="kpi-produccion">0</div>
                <div class="card-change up"><i class="fas fa-arrow-up" aria-hidden="true"></i> <span id="kpi-produccion-change">Cargando...</span></div>
            </div>
            <div class="md-card success">
                <div class="card-icon"><i class="fas fa-check-circle" aria-hidden="true"></i></div>
                <div class="card-label">Entregados Hoy</div>
                <div class="card-value" id="kpi-entregados">0</div>
                <div class="card-change up"><i class="fas fa-arrow-up" aria-hidden="true"></i> <span id="kpi-entregados-change">Cargando...</span></div>
            </div>
            <div class="md-card danger">
                <div class="card-icon"><i class="fas fa-exclamation-triangle" aria-hidden="true"></i></div>
                <div class="card-label">Pedidos Urgentes</div>
                <div class="card-value" id="kpi-urgentes">0</div>
                <div class="card-change up"><i class="fas fa-arrow-up" aria-hidden="true"></i> <span id="kpi-urgentes-change">Cargando...</span></div>
            </div>
        </div>

        <!-- (el resto del HTML permanece sin cambios para no romper funcionalidad) -->

    </main>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboardInvemex.js?v=6"></script>
    
    <!-- Hook para el loader -->
    <script>
        (function() {
            const newLoader = document.getElementById('ivx-loader');
            const originalLoadingText = document.getElementById('loading-text');
            
            if (originalLoadingText) {
                const observer = new MutationObserver(() => {});
                observer.observe(originalLoadingText, { characterData: true, childList: true, subtree: true });
            }
            
            const dashboard = document.getElementById('dashboard');
            const checkDashboard = setInterval(() => {
                if (dashboard && dashboard.style.display !== 'none' && dashboard.getAttribute('aria-hidden') === 'false') {
                    if (newLoader) {
                        newLoader.style.opacity = '0';
                        setTimeout(() => { newLoader.style.display = 'none'; }, 300);
                    }
                    clearInterval(checkDashboard);
                }
            }, 100);
            
            setTimeout(() => {
                if (newLoader) {
                    newLoader.style.opacity = '0';
                    setTimeout(() => { newLoader.style.display = 'none'; }, 300);
                }
                clearInterval(checkDashboard);
            }, 15000);
        })();
    </script>
</body>
</html>
